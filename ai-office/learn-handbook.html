<script type="module">
  import { marked } from 'https://cdn.jsdelivr.net/npm/marked@11.0.0/+esm';

  // 設定 marked 選項
  marked.setOptions({
    breaks: true,
    gfm: true,
  });

  // 載入手冊
  fetch('handbook.md')
    .then(r => r.text())
    .then(md => {
      const content = document.getElementById('content');
      content.innerHTML = marked.parse(md);

      // 建目錄
      const tocList = document.getElementById('toc-list');
      tocList.innerHTML = '';
      const h2s = content.querySelectorAll('h2');
      h2s.forEach((h2, idx) => {
        const id = `chapter-${idx + 1}`;
        h2.id = id;
        const li = document.createElement('li');
        li.innerHTML = `<a href="#${id}">${h2.textContent.replace(/（[0-9:–\s]+）/, '')}</a>`;
        tocList.appendChild(li);
      });

      // 設置 active 目錄項目
      const tocLinks = tocList.querySelectorAll('a');
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const id = entry.target.id;
            tocLinks.forEach(a => {
              a.classList.toggle('active', a.getAttribute('href') === `#${id}`);
            });
          }
        });
      }, { rootMargin: '-20% 0px -70% 0px' });

      h2s.forEach(h2 => observer.observe(h2));
    })
    .catch(err => {
      document.getElementById('content').innerHTML =
        `<div class="hb-loading">載入失敗：${err.message}</div>`;
    });

  // 回頂按鈕
  const scrollTop = document.getElementById('scrollTop');
  window.addEventListener('scroll', () => {
    scrollTop.classList.toggle('visible', window.scrollY > 400);
  });
  scrollTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
