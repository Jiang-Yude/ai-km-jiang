<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>官網 AI 客服 14 組模型評量表</title>
<style>

:root{
  --bg:#f9f9f7; --card:#fcfcfb; --ink:#0b0b0b; --sub:#52514e; --muted:#6f6e69;
  --line:#e1e0d9; --axis:#c3c2b7; --soft:#f0efec;
  --pass:#0ca30c; --unst:#fab219; --below:#ec835a; --fail:#b4b2a9;
  --pass-ink:#006300; --unst-ink:#7a5200;
  --gold:#b8860b; --hi:#eaf4e8; --hi-line:#0ca30c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0d0d0d; --card:#1a1a19; --ink:#ffffff; --sub:#c3c2b7; --muted:#a3a29b;
    --line:#2c2c2a; --axis:#383835; --soft:#232321;
    --pass:#0ca30c; --unst:#fab219; --below:#ec835a; --fail:#5f5e5a;
    --pass-ink:#5fd35f; --unst-ink:#fab219;
    --gold:#e8b830; --hi:#15271a; --hi-line:#0ca30c;}
}
:root[data-theme="dark"]{--bg:#0d0d0d; --card:#1a1a19; --ink:#ffffff; --sub:#c3c2b7; --muted:#a3a29b;
  --line:#2c2c2a; --axis:#383835; --soft:#232321;
  --pass:#0ca30c; --unst:#fab219; --below:#ec835a; --fail:#5f5e5a;
  --pass-ink:#5fd35f; --unst-ink:#fab219;
  --gold:#e8b830; --hi:#15271a; --hi-line:#0ca30c;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-size:18px;line-height:1.65;
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  padding:26px 14px 60px;}
.wrap{max-width:1100px;margin:0 auto;}
code{font-size:18px;}
.tpl-note{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:14px 18px;margin:18px 0;font-size:18px;}
.zone{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:18px 0;}
.zone>h2{font-size:24px;margin-bottom:2px;}
.zdesc{color:var(--sub);font-size:18px;margin-bottom:12px;}
.verdict{font-size:19px;line-height:1.7;background:var(--soft);border-left:4px solid var(--gold);
  border-radius:0 10px 10px 0;padding:12px 16px;margin-bottom:16px;}

/* 編碼圖例 */
.keys{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:18px;color:var(--sub);margin-bottom:14px;}
.key{display:inline-flex;align-items:center;gap:7px;}
.sw{display:inline-block;width:26px;height:12px;border-radius:0 4px 4px 0;}
.sw.old{background:transparent;outline:2px dashed var(--sub);outline-offset:0;height:10px;}
.sw.rng{background:color-mix(in srgb,var(--unst) 35%,transparent);}
.sw.hi{background:var(--hi);border-left:4px solid var(--hi-line);border-radius:3px;height:20px;}
.gd{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--sub);}

/* 表格格線：名稱｜跑道｜分數｜1000 題費用｜狀態 */
.hd,.r,.scl{display:grid;grid-template-columns:200px minmax(0,1fr) 96px 136px;
  column-gap:12px;align-items:center;}
.hd{font-size:18px;color:var(--sub);padding:0 8px 6px;border-bottom:1px solid var(--axis);}
.hd .num{text-align:right;} .hd .ctr{text-align:center;}
.scl{padding:4px 8px 0;}
.scl .cap{font-size:18px;color:var(--muted);text-align:right;}
.ticks{position:relative;height:26px;border-top:1px solid var(--line);}
.ticks span{position:absolute;top:0;font-size:18px;color:var(--muted);transform:translateX(-50%);
  font-variant-numeric:tabular-nums;line-height:26px;white-space:nowrap;}
.ticks span.first{transform:none;} .ticks span.last{transform:translateX(-100%);}
.gp{font-size:18px;color:var(--sub);padding:14px 8px 4px;margin-top:6px;border-top:1px solid var(--line);}
.gp b{color:var(--ink);font-weight:700;margin-right:10px;}

.r{padding:4px 8px;border-radius:10px;cursor:pointer;min-height:68px;}
.r:hover{background:var(--soft);}
.r:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.r.hi{background:var(--hi);box-shadow:inset 4px 0 0 var(--hi-line);}
.r.dim .nm,.r.dim .sc,.r.dim .cv{opacity:.7;}
.nm{font-size:18px;line-height:1.35;font-weight:600;}
.nm small{display:block;font-size:18px;font-weight:400;color:var(--sub);}
.nm .car{display:inline-block;width:18px;color:var(--muted);font-weight:400;transition:transform .15s;}
.r[aria-expanded="true"] .nm .car{transform:rotate(90deg);}
.tk{position:relative;height:66px;}
.bar,.band{position:absolute;left:0;top:44px;transform:translateY(-50%);border-radius:0 4px 4px 0;}
.bar.old{outline:2px dashed var(--c);outline-offset:2px;}
.band{border-radius:0 4px 4px 0;}
.dot{position:absolute;top:44px;width:14px;height:14px;border-radius:50%;background:var(--gold);
  transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--sub);}
.dl{position:absolute;top:0;font-size:18px;line-height:24px;color:var(--sub);white-space:nowrap;
  font-variant-numeric:tabular-nums;}
.sc,.cv{font-size:18px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
.sc{font-weight:700;}
.sc i{font-style:normal;font-weight:700;margin-right:4px;}
.tg{font-size:18px;padding:2px 6px;border-radius:8px;text-align:center;white-space:nowrap;}
.tg.no{background:var(--soft);color:var(--sub);border:1px solid var(--line);}
.tg.was{background:color-mix(in srgb,var(--unst) 22%,transparent);color:var(--unst-ink);}
.tg.backup{background:var(--card);color:var(--sub);border:1px solid var(--axis);}
.tg.yes{background:color-mix(in srgb,var(--pass) 20%,transparent);color:var(--pass-ink);font-weight:700;}

/* 展開明細 */
.det{display:none;margin:2px 8px 10px;padding:12px 16px;background:var(--soft);border-radius:10px;font-size:18px;}
.det.open{display:block;}
.det dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;}
.det dt{color:var(--sub);}
.det dd{overflow-wrap:anywhere;}

/* 粗細圖例與註腳 */
.thick{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;margin-top:16px;font-size:18px;color:var(--sub);}
.thick .t{display:inline-flex;align-items:center;gap:8px;}
.thick .t span.b{display:inline-block;width:32px;background:var(--sub);border-radius:0 4px 4px 0;}
.foot{font-size:18px;color:var(--sub);margin-top:12px;padding-top:12px;border-top:1px solid var(--line);line-height:1.75;}
.foot p+p{margin-top:4px;}

@media(max-width:720px){
  body{padding:18px 10px 50px;}
  .zone{padding:16px 12px;}
  .hd{display:none;}
  .r{grid-template-columns:minmax(0,1fr) auto auto;
    grid-template-areas:"nm nm nm" "tk tk tk" "sc cv cv";row-gap:2px;}
  .r .nm{grid-area:nm;} .r .tk{grid-area:tk;} .r .sc{grid-area:sc;text-align:left;}
  .r .cv{grid-area:cv;} .r .tg{grid-area:tg;}
  .r .sc::before{content:"分數 ";font-weight:400;color:var(--sub);}
  .r .cv::before{content:"1000 題費用 ";color:var(--sub);}
  .scl{grid-template-columns:minmax(0,1fr);row-gap:0;}
  .scl .cap{text-align:left;}
  .scl .pad{display:none;}
  .det dl{grid-template-columns:minmax(0,1fr);}
  .det dt{margin-top:6px;}
}


/* 總表 */
.one{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:8px 0 18px;}
.one h1{font-size:26px;line-height:1.35;}
.one .meta{color:var(--sub);font-size:17px;margin:2px 0 14px;}
.concl{font-size:21px;line-height:1.6;background:var(--hi);border-left:5px solid var(--hi-line);border-radius:0 10px 10px 0;padding:12px 16px;}
.now{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:18px;margin:12px 0 16px;}
.now span b{margin-left:4px;}
.tw{overflow-x:auto;}
table.mx{width:100%;border-collapse:collapse;min-width:820px;font-size:18px;}
.mx th{font-size:16px;font-weight:600;color:var(--sub);text-align:left;padding:6px 8px;border-bottom:1px solid var(--axis);white-space:nowrap;}
.mx td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
.mx tr.sep td{padding:14px 8px 4px;font-size:16px;color:var(--sub);border-bottom:1px solid var(--axis);}
.mx .md{white-space:nowrap;font-weight:600;}
.mx .md i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;vertical-align:1px;}
.mx .md small{display:block;font-weight:400;font-size:15px;color:var(--sub);margin-left:19px;}
.bd{display:inline-block;font-size:16px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap;}
.bd.good{background:color-mix(in srgb,var(--pass) 20%,transparent);color:var(--pass-ink);}
.bd.top{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--ink);}
.bd.fast{background:color-mix(in srgb,#2a78d6 18%,transparent);color:var(--ink);}
.bd.bad{background:color-mix(in srgb,#e34948 18%,transparent);color:#b3261e;}
.bd.plain{color:var(--sub);font-weight:400;padding-left:0;}
.cell{display:flex;align-items:center;gap:8px;}
.cell .tr{flex:1;min-width:70px;height:10px;background:var(--soft);border-radius:0 5px 5px 0;position:relative;}
.cell .tr b{position:absolute;left:0;top:0;bottom:0;border-radius:0 5px 5px 0;}
.cell .v{min-width:66px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;}
.mx tr.live td{background:color-mix(in srgb,#2a78d6 9%,transparent);}
.mx tr.live td:first-child{box-shadow:inset 4px 0 0 #2a78d6;}
.mx tr.dimr td{opacity:.6;}
.legend2{font-size:16px;color:var(--sub);margin-top:12px;line-height:1.8;}
details.old{margin-top:10px;}
details.old>summary{cursor:pointer;color:var(--sub);font-size:17px;padding:8px 0;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bd.bad{color:#ff8a80;}}
:root[data-theme="dark"] .bd.bad{color:#ff8a80;}

/* 分頁選單 */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px;}
.tabs button{font:inherit;font-size:18px;padding:8px 16px;border-radius:999px;border:1px solid var(--axis);background:var(--card);color:var(--ink);cursor:pointer;}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700;}
.pane[hidden]{display:none;}
.mrow{display:grid;grid-template-columns:270px minmax(0,1fr) 230px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);}
.mrow .mn{font-weight:600;white-space:nowrap;font-size:17px;}
.mrow .mn i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;}
.mrow .mn small{font-weight:400;color:var(--sub);font-size:14px;margin-left:4px;}
.mrow .tr2{height:18px;position:relative;}
.mrow .tr2 b{position:absolute;left:0;top:0;bottom:0;border-radius:0 5px 5px 0;}
.mrow .tr2 b.est{background:repeating-linear-gradient(45deg,var(--c) 0 6px,transparent 6px 10px)!important;outline:1.5px dashed var(--c);}
.mrow .mv{text-align:right;font-variant-numeric:tabular-nums;font-size:17px;white-space:nowrap;}
.mrow .mv b{font-size:18px;}
.mrow .mv span{color:var(--sub);font-size:15px;margin-left:8px;}
.mrow.base{background:color-mix(in srgb,#2a78d6 9%,transparent);}
.opt{font-size:17px;color:var(--sub);margin-bottom:8px;display:flex;gap:18px;flex-wrap:wrap;}
.opt label{cursor:pointer;}
.big2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:6px;}
.mcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--soft);}
.mcard h3{font-size:20px;margin-bottom:6px;}
.mcard table{width:100%;border-collapse:collapse;font-size:17px;}
.mcard td,.mcard th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.mcard th{font-weight:600;color:var(--sub);font-size:15px;}
.mcard td:first-child,.mcard th:first-child{text-align:left;}
.mcard tr.mid td{font-weight:700;}
@media(max-width:720px){.mrow{grid-template-columns:minmax(0,1fr) auto;}.mrow .tr2{grid-column:1/-1;order:3;}}

/* ④ 紅綠燈 */
table.tl{width:100%;border-collapse:separate;border-spacing:0 6px;min-width:680px;font-size:18px;}
.tl th{font-size:16px;color:var(--sub);font-weight:600;text-align:left;padding:2px 10px;}
.tl td{padding:10px 12px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.tl td.nm{font-weight:600;}
.tl td.nm small{display:block;font-weight:400;font-size:15px;color:var(--sub);}
.tl td.c{border-radius:8px;font-weight:700;}
.tl td.c::before{content:attr(data-i);display:inline-block;width:22px;font-weight:700;}
.tl td.tok{background:color-mix(in srgb,#0ca30c 22%,transparent);color:var(--pass-ink);}
.tl td.tmid{background:color-mix(in srgb,#fab219 26%,transparent);color:var(--unst-ink);}
.tl td.tbad{background:color-mix(in srgb,#e34948 20%,transparent);color:#b3261e;}
.tl td.n{font-size:20px;letter-spacing:2px;}
.tl tr.live td.nm{box-shadow:inset 4px 0 0 #2a78d6;}
.tl tr.sep td{padding:12px 10px 0;font-size:16px;color:var(--sub);font-weight:400;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tl td.tbad{color:#ff8a80;}}
:root[data-theme="dark"] .tl td.tbad{color:#ff8a80;}

/* ④ 驗證頁 */
.vt{width:100%;border-collapse:collapse;font-size:17px;margin:6px 0 4px;}
.vt th{font-size:15px;color:var(--sub);text-align:left;padding:6px 8px;border-bottom:1px solid var(--axis);font-weight:600;}
.vt td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
.vt td.up{color:var(--pass-ink);font-weight:700;} .vt td.dn{color:#b3261e;font-weight:700;}
.vsec{margin:18px 0 6px;font-size:20px;font-weight:700;}
.vnote{font-size:16px;color:var(--sub);line-height:1.7;}
body{background:transparent;padding:14px 16px 10px;}
.zone h2{font-size:22px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="zone" style="margin:0;border:none;padding:0;background:transparent">
  <h2 id="ttl" hidden></h2>
  <div class="zdesc" id="sub"></div>
  <div class="verdict" id="read"></div>
  <div class="keys" id="keys"></div>

  <div class="hd"><span>候選</span><span id="encHd">長度＝回答品質　顏色＝成本　圓點＝耗時</span><span class="num">分數</span><span class="num">1000 題費用</span></div>
  <div class="scl"><span class="cap" id="capS">長條刻度（分）</span><div class="ticks" id="tkS"></div><span class="pad"></span><span class="pad"></span></div>
  <div class="scl"><span class="cap">圓點刻度（秒）</span><div class="ticks" id="tkT"></div><span class="pad"></span><span class="pad"></span></div>
  <div id="rows"></div>

  <div class="thick" id="thick"></div>
  <div class="foot" id="foot"></div>
</div>

function ticks(id,max,step,unit){
  const el=document.getElementById(id);let h='';
  for(let v=0;v<=max;v+=step){
    const cls=v===0?'first':(v+step>max?'last':'');
    h+=`<span class="${cls}" style="left:${pct(v,max)}%">${v}${v+step>max?unit:''}</span>`;
  }
  el.innerHTML=h;
}
