<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>江江教練的 LINE 名片</title>
<meta property="og:title" content="江江教練的 LINE 名片"><meta property="og:description" content="加江江 LINE 好友，或把這組名片轉傳給朋友。"><meta property="og:image" content="https://jiangyude.com/card/portrait-round.png">
<style>
:root{--paper:#fffcf6;--ink:#382f26;--muted:#817466;--gold:#a27c45;--green:#06c755;--line:#e3d8c6}
*{box-sizing:border-box}
body{margin:0;background:#f5f0e7;color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.4}
header{max-width:520px;margin:0 auto;padding:22px 16px 6px;text-align:center}
h1{font-size:22px;margin:0 0 14px;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 12px;border-radius:14px;font-size:20px;font-weight:700;text-decoration:none}
.add{background:var(--green);color:#fff;box-shadow:0 6px 18px #06c75533}
.share{background:var(--paper);color:var(--ink);border:1px solid var(--line);font-size:18px}
.hint{font-size:16px;color:var(--muted);margin:10px 0 0}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px;align-items:stretch;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.bubble{flex:0 0 min(86vw,386px);scroll-snap-align:center;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px #7b61341a}
.bubble>.body{flex:1}
.dots{display:flex;justify-content:center;gap:8px;padding:0 0 6px}
.dots i{width:8px;height:8px;border-radius:50%;background:#d8ccb8}.dots i.on{background:var(--gold)}
footer{max-width:520px;margin:0 auto;padding:6px 16px 28px}
.fx-link{display:block;text-align:center;color:#42659a;font-size:16px;padding:10px 0;text-decoration:none}
</style></head><body>
<header>
<h1>江江教練的 LINE 名片</h1>
<!-- 加好友：江江個人 LINE（2026-10-19 江江提供） -->
<a class="btn add" id="add" href="https://line.me/ti/p/tBx4pCgLnz">加江江 LINE 好友</a>
<p class="hint">左右滑動看五張名片</p>
</header>
<main class="rail" id="rail" aria-label="江江的五張名片"></main>
<div class="dots" id="dots"></div>
<footer>
<a class="btn share" href="https://liff.line.me/2012081068-MnNPDX8P"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#06c755" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1"/><path d="M12 14V3"/><path d="M8.5 6.5 12 3l3.5 3.5"/></svg>轉傳這組名片</a>
<p class="hint" style="text-align:center">選好友或群組，對方會收到這五張名片。</p>
</footer>
<script>
// 直接讀上線中的 LINE 名片檔畫出來（名片改了，這頁跟著變）
var FS={xxs:11,xs:13,sm:14,md:16,lg:19,xl:22,xxl:29,'3xl':35,'4xl':48,'5xl':74};
var SP={none:0,xs:2,sm:4,md:8,lg:12,xl:16,xxl:20};
function px(v,map){if(v==null)return null;if(map&&map[v]!=null)return map[v]+'px';return v;}
function el(n){
  var t=n.type,d;
  if(t==='box'){
    d=document.createElement(n.action?'a':'div');
    if(n.action){d.href=n.action.uri;d.style.textDecoration='none';d.style.color='inherit';}
    d.style.display='flex';d.style.flexDirection=n.layout==='horizontal'||n.layout==='baseline'?'row':'column';
    if(n.layout==='baseline')d.style.alignItems='baseline';
    if(n.alignItems)d.style.alignItems=n.alignItems==='center'?'center':n.alignItems==='flex-end'?'flex-end':'flex-start';
    if(n.backgroundColor)d.style.background=n.backgroundColor;
    if(n.cornerRadius)d.style.borderRadius=n.cornerRadius;
    ['paddingAll','paddingTop','paddingBottom','paddingStart','paddingEnd'].forEach(function(k){if(n[k]){var v=px(n[k],SP);if(k==='paddingAll')d.style.padding=v;else d.style[{paddingTop:'paddingTop',paddingBottom:'paddingBottom',paddingStart:'paddingLeft',paddingEnd:'paddingRight'}[k]]=v;}});
    var gap=n.spacing?px(n.spacing,SP):'0px';
    (n.contents||[]).forEach(function(c,i){var ch=el(c);var m=c.margin!=null?px(c.margin,SP):(i?gap:null);if(i&&m){if(d.style.flexDirection==='row')ch.style.marginLeft=m;else ch.style.marginTop=m;}d.appendChild(ch);});
  }else if(t==='text'){
    d=document.createElement('div');d.textContent=n.text;d.style.whiteSpace='pre-line';
    d.style.fontSize=px(n.size||'md',FS);if(n.color)d.style.color=n.color;if(n.weight==='bold')d.style.fontWeight='700';
    if(n.align)d.style.textAlign=n.align==='start'?'left':n.align==='end'?'right':n.align;
  }else if(t==='image'){
    d=document.createElement('img');d.src=n.url;d.alt='';d.loading='lazy';
    var r=(n.aspectRatio||'1:1').split(':');d.style.aspectRatio=r[0]+'/'+r[1];
    d.style.objectFit=n.aspectMode==='cover'?'cover':'contain';
    d.style.width=(!n.size||n.size==='full')?'100%':px(n.size,{xxs:40,xs:60,sm:80,md:100,lg:120,xl:140,xxl:160,'3xl':180,'4xl':200,'5xl':220});
    d.style.maxWidth='100%';d.style.display='block';
    if(n.gravity==='bottom')d.style.alignSelf='flex-end';
    if(n.align==='center'||(!n.align&&n.size&&n.size!=='full'))d.style.margin='0 auto';
  }else if(t==='button'){
    d=document.createElement('a');d.className='fx-link';d.href=n.action.uri;d.textContent=n.action.label;
  }else{d=document.createElement('div');}
  if(n.flex!=null)d.style.flex=n.flex===0?'0 0 auto':String(n.flex);
  if(n.position==='relative'){d.style.position='relative';if(n.offsetStart)d.style.left=n.offsetStart;if(n.offsetTop)d.style.top=n.offsetTop;}
  return d;
}
fetch('/card/line-flex.json').then(function(r){return r.json();}).then(function(f){
  var car=f.contents.type==='carousel'?f.contents.contents:[f.contents],rail=document.getElementById('rail'),dots=document.getElementById('dots');
  car.forEach(function(b,i){
    var w=document.createElement('article');w.className='bubble';
    var body=el(b.body);body.classList.add('body');w.appendChild(body);
    if(b.footer)w.appendChild(el(b.footer));
    rail.appendChild(w);var dot=document.createElement('i');if(!i)dot.className='on';dots.appendChild(dot);
  });
  rail.addEventListener('scroll',function(){var k=Math.round(rail.scrollLeft/(rail.firstChild.offsetWidth+14));[].forEach.call(dots.children,function(x,j){x.className=j===k?'on':'';});});
});
</script>
<script src="/views.js"></script>
</body></html>
