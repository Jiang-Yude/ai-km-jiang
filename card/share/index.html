<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>分享江江教練的 LINE 名片</title>
<meta property="og:title" content="分享江江教練的 LINE 名片"><meta property="og:description" content="選好友或群組，把江江教練的五張 LINE 名片傳出去。"><meta property="og:image" content="https://jiangyude.com/card/portrait.png">
<style>
:root{--paper:#fffcf6;--ink:#382f26;--muted:#817466;--gold:#a27c45;--green:#B69A78;--line:#e3d8c6}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f5f0e7;color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.7;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{max-width:420px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:23px;padding:32px 24px;text-align:center}
#first{min-height:200px;margin:0 auto 16px;max-width:360px;text-align:left}
#first .fx-bubble{flex:none;width:100%}
h1{font-family:"Songti TC","Noto Serif TC",serif;font-size:28px;font-weight:600;color:var(--gold);margin:0 0 8px}
p{font-size:18px;margin:0 0 20px;color:var(--muted)}
button{font:inherit;font-size:20px;font-weight:600;width:100%;padding:14px 12px;border-radius:12px;border:0;background:var(--green);color:var(--ink);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#msg{font-size:18px;color:var(--ink);margin:18px 0 0;min-height:1.7em}
a{color:var(--gold)}
#custom{display:none}.custom #mine{display:none}.custom #custom{display:block}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -24px 16px;padding:4px 24px;text-align:left}
.fx-bubble{flex:0 0 260px;scroll-snap-align:center;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line);font-size:14px;line-height:1.4}
.fx-link{display:block;text-align:center;color:#42659a;padding:8px 0;text-decoration:none}
.note{font-size:15px;color:var(--muted);margin:14px 0 0}
#fwd{display:none}.fwd #mine{display:none}.fwd #fwd{display:block}
#fwdRail .slot{flex-basis:min(66vw,300px);aspect-ratio:auto}
.fwd #mineLink{display:none}
/* 轉傳頁版型：照丁禹勝老師的轉傳頁（上方橫幅＋名片框＋大按鈕），配色用江江的咖啡金（2026-10-21） */
.band{display:none}
body.fwd{display:block;padding:0}
.fwd .band{display:block;background:linear-gradient(135deg,#8a6a3f,#4f3a20);color:#fffcf6;padding:28px 16px 84px}
.band>div{max-width:820px;margin:0 auto}
.band .kicker{color:#f0d9b0;font-size:13px;letter-spacing:.3em;margin:0 0 6px}
.band h1{color:#fffcf6;font-size:32px;margin:0 0 6px;text-align:left}
.band p{color:#f5ead8;font-size:17px;margin:0;text-align:left}
.fwd main{max-width:860px;margin:-56px auto 32px;padding:20px 16px 28px;box-shadow:0 12px 32px #4f3a2022}
.fwd #fwdRail{background:#efe5d3;border-radius:16px;margin:0 0 10px;padding:16px;gap:14px}
.pnote{font-size:13px;color:var(--muted);text-align:center;margin:0 0 18px}
.fwd button{background:linear-gradient(180deg,#a27c45,#7d5d31);color:#fffcf6;font-size:26px;padding:22px 12px;border-radius:16px;box-shadow:0 8px 20px #7d5d3140;margin:0 0 6px}
.fwd #msg{margin:0 0 10px;min-height:0;text-align:center}
.kicker{font-size:13px;letter-spacing:.3em;color:var(--gold);margin:0 0 4px}
</style></head><body>
<header class="band"><div>
<p class="kicker">FORWARD CARD</p>
<h1>轉傳名片</h1>
<p>把江昱德・江江教練的名片分享給你的朋友</p>
</div></header>
<main>
<div id="mine">
<div id="first" aria-label="江江的第一張名片"></div>
<h1>分享江江的 LINE 名片</h1>
<p>選好友或群組，對方會收到五張可以左右滑的名片。</p>
</div>
<div id="fwd">
<div class="rail" id="fwdRail"></div>
<p class="pnote">往左滑看完五張。預覽不是 LINE 官方畫面，字型與換行可能略有不同，實際以 LINE 為準。</p>
<p class="pnote" style="font-size:16px;margin-top:8px"><a href="/line-card-share/">我也想做自己的 LINE 名片</a></p>
</div>
<div id="custom">
<h1>分享這組 LINE 名片</h1>
<p>選好友或群組，對方會收到下面這組名片。</p>
<div class="rail" id="rail"></div>
</div>
<button id="share" disabled>選擇好友或群組</button>
<p id="msg">準備中…</p>
<p style="font-size:16px;margin:0" id="mineLink"><a href="/linecard/">先看名片長什麼樣子</a></p>
<p class="note" id="customNote" hidden>這組名片的內容由製作的人提供。這一頁只負責叫出 LINE 的分享畫面，不會記錄你傳給誰。<br><a href="/line-card-share/">我也想做自己的 LINE 名片分享連結</a></p>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="/card/flex-render.js"></script>
<script src="/card/flex-share.js"></script>
<script>
// 江江自己的 LIFF（LINE Developers：江江教練名片 channel）
var LIFF_ID = '2012081068-MnNPDX8P';
var btn = document.getElementById('share'), msg = document.getElementById('msg'), card = null, autoTried = false, custom = false;
function say(t){ msg.textContent = t; }
// 讀網址參數：LINE 從 liff.line.me 轉過來時，參數可能包在 liff.state 裡
function param(n){
  var s = new URLSearchParams(location.search); if (s.get(n)) return s.get(n);
  var st = s.get('liff.state'); return st ? new URLSearchParams(st.split('?')[1] || '').get(n) : null;
}
// 從名片上「轉傳這張名片」點進來（?fwd=1）：先給人看整組名片，再自己按轉傳
var isFwd = param('fwd') === '1';
function countShare(){
  // 只記「有人送出一次分享」的次數，不記是誰、送到哪裡
  try { fetch('/api/view', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ path: custom ? '/card/share/sent-custom/' : isFwd ? '/card/share/sent-forward/' : '/card/share/sent/', increment:true, vid:'', ref:'' }) }).catch(function(){}); } catch(e){}
}
async function share(){
  if (!card) return say('名片還沒載入，請重新整理再試。');
  if (!liff.isApiAvailable('shareTargetPicker')) return say('這個環境不能分享，請用手機 LINE 開啟這一頁。');
  btn.disabled = true;
  try {
    var res = await liff.shareTargetPicker([card], { isMultiple: true });
    if (res) { countShare(); say('已分享，謝謝你！'); } else { say('已取消，想分享再按一次。'); }
  } catch (e) { say('分享失敗：' + e.message); }
  btn.disabled = false;
}
btn.onclick = share;
// 送出前在每一張底部加小字「轉傳這張名片」（照丁禹勝老師的做法，2026-10-21 江江定）：收到的人在 LINE 裡一按，就回到這一頁看完名片再選好友傳出去。
// 只加在送出的訊息上，官網看到的名片（line-flex.json）不動。別人的名片（?c=）連結太長放不進按鈕，不加。
var FORWARD_URI = 'https://liff.line.me/' + LIFF_ID + '?fwd=1';
// 轉傳頁預覽：量出每張名片的自然高度，取最高的當五張共同高度，再整張等比縮到格子寬度
function fitFwd(){
  var slots = document.querySelectorAll('#fwdRail .slot'), max = 0;
  [].forEach.call(slots, function(s){ var b = s.firstElementChild; b.style.height = 'auto'; max = Math.max(max, b.scrollHeight); });
  [].forEach.call(slots, function(s){ var b = s.firstElementChild, k = s.clientWidth / CARD_W;
    b.style.height = max + 'px'; b.style.transform = 'scale(' + k + ')'; s.style.height = (max * k) + 'px'; });
}
function withForward(m){
  var copy = JSON.parse(JSON.stringify(m));
  var bubbles = copy.contents && copy.contents.type === 'carousel' ? copy.contents.contents : [copy.contents];
  bubbles.forEach(function(b){
    if (!b || b.type !== 'bubble') return;
    // 跟「認識江江・看官網」同一種連結式按鈕（也是丁禹勝老師名片的樣式），江江 2026-10-21 要一眼看得到
    var link = { type:'button', style:'link', height:'sm', action:{ type:'uri', label:'轉傳這張名片', uri:FORWARD_URI } };
    // 原本底部若是直排就接在後面；橫排或其他就整個包進一層直排，避免小字擠在旁邊（阿港 2026-10-21 審）
    if (b.footer && b.footer.type === 'box' && b.footer.layout === 'vertical' && Array.isArray(b.footer.contents)) { b.footer.contents.push(link); }
    else if (b.footer) b.footer = { type:'box', layout:'vertical', contents:[b.footer, link] };
    else b.footer = { type:'box', layout:'vertical', paddingAll:'6px', backgroundColor:'#FFFCF6', contents:[link] };
  });
  return copy;
}
// 沒帶 ?c= 時，上方直接畫出江江的第一張名片（名片改了這裡跟著變）
if (!param('c') && !isFwd) fetch('/card/line-flex.json').then(function(r){ return r.json(); }).then(function(f){ var b = renderFlexBubbles(f)[0]; if (b) document.getElementById('first').appendChild(b); }).catch(function(){});
(async function(){
  try {
    await liff.init({ liffId: LIFF_ID });
    // 分享器做出來的連結會帶 ?c=（別人的名片）；沒帶就是江江自己的名片
    var code = param('c');
    if (code) {
      custom = true; document.body.classList.add('custom');
      document.getElementById('mineLink').hidden = true; document.getElementById('customNote').hidden = false;
      var m; try { m = FLEX_SHARE.normalize(await FLEX_SHARE.decode(code)); }
      catch (e) { return say('這個分享連結壞掉了（' + e.message + '），請跟給你連結的人要一條新的。'); }
      var errs = FLEX_SHARE.check(m);
      if (errs.length) return say('這組名片沒通過檢查：' + errs[0]);
      card = m; document.title = '分享 LINE 名片';
      renderFlexBubbles(m).forEach(function(b){ document.getElementById('rail').appendChild(b); });
      // 讓分享的人看得到名片裡的連結會開到哪些網站
      if (errs.hosts && errs.hosts.length) { var h = document.createElement('p'); h.className = 'note'; h.textContent = '名片裡的連結會開到：' + errs.hosts.join('、'); document.getElementById('custom').appendChild(h); }
    } else {
      var mine = await fetch('/card/line-flex.json').then(function(r){ return r.json(); });
      card = withForward(mine);
      if (isFwd) {
        document.body.classList.add('fwd'); btn.textContent = '選擇好友轉傳'; document.title = '轉傳江江教練的 LINE 名片';
        // 江江 2026-10-21：轉傳按鈕放在名片上面、做大一點，一進來就看到
        var fwdBox = document.getElementById('fwd'); fwdBox.insertBefore(msg, fwdBox.firstChild); fwdBox.insertBefore(btn, msg);
        // 跟 /linecard/ 一樣照 LINE 寬度排 3:4 再縮小，換行才不會擠（AUT 2026-10-21）
        // 預覽畫「實際會傳出去」的那組（每張底部有轉傳這張名片），高度照 LINE：五張一樣高、以最高那張為準
        renderFlexCards(card).forEach(function(b){ document.getElementById('fwdRail').appendChild(b); });
        fitFwd(); window.addEventListener('resize', fitFwd);
      }
    }
    // 登入回來時網址要保留 fwd=1，否則會被當成首頁進來而自動跳選人（CX、阿港 2026-10-21 審）
    if (!liff.isLoggedIn()) { say('請先登入 LINE…'); return liff.login({ redirectUri: isFwd ? location.origin + location.pathname + '?fwd=1' : location.href }); }
    btn.disabled = false; say('');
    if (!autoTried && !isFwd) { autoTried = true; share(); }
  } catch (e) { say('開啟失敗：' + e.message); }
})();
</script>
</body></html>
