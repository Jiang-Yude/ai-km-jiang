const h=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},k,u(P.c)));
document.open();document.write(h);document.close();}catch(x){e.textContent='密碼不對，請再試一次。';}});
</script>
