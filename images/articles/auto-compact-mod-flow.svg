<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1220" viewBox="0 0 680 610" role="img" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"><title>自動壓縮 Mod 的兩套機制</title><desc>階段性壓縮：我說壓縮上下文，AI 先寫日誌和續接卡，這輪答完。閒置壓縮：最後一輪結束數 55 分鐘，時間到 Mod 自己送話叫 AI 寫日誌。兩條都送出 /compact 排隊，壓縮完成後摘要另存。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8a7f70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="610" fill="#fffaf0"/>
<text x="190" y="22" font-size="17" font-weight="700" fill="#24476a" text-anchor="middle" dominant-baseline="central">階段性壓縮</text>
<text x="490" y="22" font-size="17" font-weight="700" fill="#5a4718" text-anchor="middle" dominant-baseline="central">閒置壓縮</text>
<rect x="60" y="40" width="260" height="56" rx="8" fill="#e3edf6" stroke="#5689b8" stroke-width="1.2"/>
<text x="190.0" y="57.0" font-size="16" font-weight="700" fill="#24476a" text-anchor="middle" dominant-baseline="central">我說「壓縮上下文」</text>
<text x="190.0" y="80.0" font-size="13" font-weight="400" fill="#24476a" text-anchor="middle" dominant-baseline="central">語音聽錯的也算</text>
<rect x="60" y="136" width="260" height="56" rx="8" fill="#e3edf6" stroke="#5689b8" stroke-width="1.2"/>
<text x="190.0" y="153.0" font-size="16" font-weight="700" fill="#24476a" text-anchor="middle" dominant-baseline="central">AI 先寫日誌和續接卡</text>
<text x="190.0" y="176.0" font-size="13" font-weight="400" fill="#24476a" text-anchor="middle" dominant-baseline="central">Mod 在這句話加上提醒</text>
<rect x="60" y="232" width="260" height="56" rx="8" fill="#e3edf6" stroke="#5689b8" stroke-width="1.2"/>
<text x="190.0" y="249.0" font-size="16" font-weight="700" fill="#24476a" text-anchor="middle" dominant-baseline="central">這一輪正常答完</text>
<text x="190.0" y="272.0" font-size="13" font-weight="400" fill="#24476a" text-anchor="middle" dominant-baseline="central">接著進入壓縮</text>
<rect x="360" y="40" width="260" height="56" rx="8" fill="#f8ecd2" stroke="#a08144" stroke-width="1.2"/>
<text x="490.0" y="57.0" font-size="16" font-weight="700" fill="#5a4718" text-anchor="middle" dominant-baseline="central">最後一輪結束</text>
<text x="490.0" y="80.0" font-size="13" font-weight="400" fill="#5a4718" text-anchor="middle" dominant-baseline="central">開始數 55 分鐘</text>
<rect x="360" y="136" width="260" height="56" rx="8" fill="#f8ecd2" stroke="#a08144" stroke-width="1.2"/>
<text x="490.0" y="153.0" font-size="16" font-weight="700" fill="#5a4718" text-anchor="middle" dominant-baseline="central">55 分鐘到，沒有新訊息</text>
<text x="490.0" y="176.0" font-size="13" font-weight="400" fill="#5a4718" text-anchor="middle" dominant-baseline="central">中途我說話就重新數</text>
<rect x="360" y="232" width="260" height="56" rx="8" fill="#f8ecd2" stroke="#a08144" stroke-width="1.2"/>
<text x="490.0" y="249.0" font-size="16" font-weight="700" fill="#5a4718" text-anchor="middle" dominant-baseline="central">Mod 自己送一句話</text>
<text x="490.0" y="272.0" font-size="13" font-weight="400" fill="#5a4718" text-anchor="middle" dominant-baseline="central">叫 AI 寫日誌，寫完答完</text>
<line x1="190" y1="96" x2="190" y2="134" stroke="#8a7f70" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="190" y1="192" x2="190" y2="230" stroke="#8a7f70" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="190" y1="288" x2="190" y2="326" stroke="#8a7f70" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="490" y1="96" x2="490" y2="134" stroke="#8a7f70" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="490" y1="192" x2="490" y2="230" stroke="#8a7f70" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="490" y1="288" x2="490" y2="326" stroke="#8a7f70" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="160" y="328" width="360" height="56" rx="8" fill="#e6efe0" stroke="#5f7553" stroke-width="1.2"/>
<text x="340.0" y="345.0" font-size="16" font-weight="700" fill="#2f3d27" text-anchor="middle" dominant-baseline="central">送出 /compact 排隊</text>
<text x="340.0" y="368.0" font-size="13" font-weight="400" fill="#2f3d27" text-anchor="middle" dominant-baseline="central">等於我手打，等對話空檔才執行</text>
<line x1="340" y1="384" x2="340" y2="422" stroke="#8a7f70" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="160" y="424" width="360" height="56" rx="8" fill="#e6efe0" stroke="#5f7553" stroke-width="1.2"/>
<text x="340.0" y="441.0" font-size="16" font-weight="700" fill="#2f3d27" text-anchor="middle" dominant-baseline="central">壓縮完成</text>
<text x="340.0" y="464.0" font-size="13" font-weight="400" fill="#2f3d27" text-anchor="middle" dominant-baseline="central">摘要另存一份到續接卡資料夾</text>
<text x="340" y="505" font-size="13" font-weight="700" fill="#6a635a" text-anchor="middle" dominant-baseline="central">例外狀況</text>
<rect x="60" y="522" width="260" height="56" rx="8" fill="none" stroke="#b9ad98" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="190.0" y="539.0" font-size="16" font-weight="700" fill="#5a5248" text-anchor="middle" dominant-baseline="central">這輪被打斷或出錯</text>
<text x="190.0" y="562.0" font-size="13" font-weight="400" fill="#5a5248" text-anchor="middle" dominant-baseline="central">記號留著，等下一輪答完</text>
<rect x="360" y="522" width="260" height="56" rx="8" fill="none" stroke="#b9ad98" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="490.0" y="539.0" font-size="16" font-weight="700" fill="#5a5248" text-anchor="middle" dominant-baseline="central">送出 5 分鐘還沒壓縮</text>
<text x="490.0" y="562.0" font-size="13" font-weight="400" fill="#5a5248" text-anchor="middle" dominant-baseline="central">提示我手打，不重複送</text>
</svg>
