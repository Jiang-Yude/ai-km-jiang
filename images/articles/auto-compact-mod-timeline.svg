<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="960" viewBox="0 0 680 480" role="img" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"><title>有沒有自動壓縮 Mod 的差別</title><desc>上方區塊：沒有 Mod，離開超過 60 分鐘快取過期，回來第一句整段用一般價重算。下方區塊：有 Mod，第 55 分鐘先寫工作日誌再壓縮，回來是短對話加一份工作日誌。</desc>
<rect width="680" height="480" fill="#fffaf0"/>
<rect x="20" y="16" width="640" height="196" rx="14" fill="#ffffff" stroke="#C4552D" stroke-width="1.6"/>
<rect x="20" y="16" width="640" height="40" rx="14" fill="#fbe3d8" stroke="#C4552D" stroke-width="1.6"/><rect x="21" y="42" width="638" height="14" fill="#fbe3d8"/>
<text x="40" y="36" font-size="17" font-weight="700" fill="#7a2f14" text-anchor="start" dominant-baseline="central">情況 A：沒有 Mod</text>
<text x="640" y="36" font-size="13" font-weight="400" fill="#7a2f14" text-anchor="end" dominant-baseline="central">離開後什麼都不做</text>
<line x1="60" y1="78" x2="620" y2="78" stroke="#b9ad98"/>
<text x="60" y="66" font-size="12" font-weight="400" fill="#6a635a" text-anchor="middle" dominant-baseline="central">0 分</text>
<text x="452" y="66" font-size="12" font-weight="700" fill="#a08144" text-anchor="middle" dominant-baseline="central">55 分</text>
<text x="520" y="66" font-size="12" font-weight="700" fill="#C4552D" text-anchor="middle" dominant-baseline="central">60 分</text>
<line x1="520" y1="78" x2="520" y2="144" stroke="#C4552D" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="60" y="94" width="460" height="32" rx="4" fill="#e6efe0" stroke="#5f7553" stroke-width="1"/>
<text x="290.0" y="110" font-size="13" font-weight="400" fill="#2f3d27" text-anchor="middle" dominant-baseline="central">閒置中，快取還在</text>
<rect x="520" y="94" width="100" height="32" rx="4" fill="#efe9de" stroke="#b9ad98" stroke-width="1"/>
<text x="570.0" y="110" font-size="13" font-weight="400" fill="#5a5248" text-anchor="middle" dominant-baseline="central">已過期</text>
<rect x="160" y="154" width="460" height="44" rx="8" fill="#fbe3d8" stroke="#C4552D" stroke-width="1.2"/>
<text x="390" y="176" font-size="16" font-weight="700" fill="#7a2f14" text-anchor="middle" dominant-baseline="central">回來第一句：整段用一般價重算</text>
<rect x="20" y="240" width="640" height="196" rx="14" fill="#ffffff" stroke="#5f7553" stroke-width="1.6"/>
<rect x="20" y="240" width="640" height="40" rx="14" fill="#e6efe0" stroke="#5f7553" stroke-width="1.6"/><rect x="21" y="266" width="638" height="14" fill="#e6efe0"/>
<text x="40" y="260" font-size="17" font-weight="700" fill="#2f3d27" text-anchor="start" dominant-baseline="central">情況 B：有自動壓縮 Mod</text>
<text x="640" y="260" font-size="13" font-weight="400" fill="#2f3d27" text-anchor="end" dominant-baseline="central">第 55 分鐘先整理</text>
<line x1="60" y1="302" x2="620" y2="302" stroke="#b9ad98"/>
<text x="60" y="290" font-size="12" font-weight="400" fill="#6a635a" text-anchor="middle" dominant-baseline="central">0 分</text>
<text x="452" y="290" font-size="12" font-weight="700" fill="#a08144" text-anchor="middle" dominant-baseline="central">55 分</text>
<text x="520" y="290" font-size="12" font-weight="700" fill="#C4552D" text-anchor="middle" dominant-baseline="central">60 分</text>
<line x1="520" y1="302" x2="520" y2="368" stroke="#C4552D" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="452" y1="302" x2="452" y2="368" stroke="#a08144" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="60" y="318" width="392" height="32" rx="4" fill="#e6efe0" stroke="#5f7553" stroke-width="1"/>
<text x="256.0" y="334" font-size="13" font-weight="400" fill="#2f3d27" text-anchor="middle" dominant-baseline="central">閒置中，快取還在</text>
<rect x="452" y="318" width="68" height="32" rx="4" fill="#f8ecd2" stroke="#a08144" stroke-width="1"/>
<text x="486.0" y="334" font-size="13" font-weight="700" fill="#5a4718" text-anchor="middle" dominant-baseline="central">寫＋壓</text>
<rect x="520" y="326" width="100" height="16" rx="4" fill="#efe9de" stroke="#b9ad98" stroke-width="1"/>
<rect x="160" y="378" width="460" height="44" rx="8" fill="#e6efe0" stroke="#5f7553" stroke-width="1.2"/>
<text x="390" y="400" font-size="16" font-weight="700" fill="#2f3d27" text-anchor="middle" dominant-baseline="central">回來：短對話＋一份工作日誌</text>
<text x="30" y="456" font-size="13" font-weight="400" fill="#6a635a" text-anchor="start" dominant-baseline="central">寫＋壓＝先寫工作日誌和續接卡，再壓縮上下文（這時讀前面的對話還是快取價）</text>
</svg>
