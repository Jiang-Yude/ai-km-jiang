<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="680" viewBox="0 0 680 340" role="img" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"><title>有沒有自動壓縮 Mod 的差別</title><desc>沒有 Mod：離開超過 60 分鐘快取過期，回來第一句話整段用一般價重算。有 Mod：第 55 分鐘先寫工作日誌再壓縮，回來是短對話加一份工作日誌。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8a7f70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="340" fill="#fffaf0"/>
<line x1="120" y1="44" x2="620" y2="44" stroke="#b9ad98" stroke-width="1"/>
<text x="120" y="30" font-size="13" font-weight="400" fill="#6a635a" text-anchor="middle" dominant-baseline="central">0 分</text>
<text x="487" y="30" font-size="13" font-weight="700" fill="#a08144" text-anchor="middle" dominant-baseline="central">55 分</text>
<text x="545" y="30" font-size="13" font-weight="700" fill="#C4552D" text-anchor="middle" dominant-baseline="central">60 分</text>
<line x1="545" y1="44" x2="545" y2="300" stroke="#C4552D" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="487" y1="44" x2="487" y2="300" stroke="#a08144" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="30" y="104" font-size="16" font-weight="700" fill="#3a342d" text-anchor="start" dominant-baseline="central">沒有 Mod</text>
<rect x="120" y="88" width="425" height="32" rx="4" fill="#e6efe0" stroke="#5f7553"/><text x="332" y="104" font-size="13" font-weight="400" fill="#2f3d27" text-anchor="middle" dominant-baseline="central">閒置中，快取還在</text>
<rect x="545" y="88" width="75" height="32" rx="4" fill="#efe9de" stroke="#b9ad98"/><text x="582" y="104" font-size="13" font-weight="400" fill="#5a5248" text-anchor="middle" dominant-baseline="central">已過期</text>
<rect x="290" y="134" width="330" height="46" rx="8" fill="#fbe3d8" stroke="#C4552D" stroke-width="1.2"/>
<text x="455.0" y="157.0" font-size="15" font-weight="700" fill="#7a2f14" text-anchor="middle" dominant-baseline="central">回來第一句：整段用一般價重算</text>
<text x="30" y="228" font-size="16" font-weight="700" fill="#3a342d" text-anchor="start" dominant-baseline="central">有 Mod</text>
<rect x="120" y="212" width="367" height="32" rx="4" fill="#e6efe0" stroke="#5f7553"/><text x="303" y="228" font-size="13" font-weight="400" fill="#2f3d27" text-anchor="middle" dominant-baseline="central">閒置中，快取還在</text>
<rect x="487" y="212" width="58" height="32" rx="4" fill="#f8ecd2" stroke="#a08144"/><text x="516" y="228" font-size="13" font-weight="700" fill="#5a4718" text-anchor="middle" dominant-baseline="central">寫＋壓</text>
<rect x="545" y="220" width="75" height="16" rx="4" fill="#efe9de" stroke="#b9ad98"/>
<rect x="290" y="258" width="330" height="46" rx="8" fill="#e6efe0" stroke="#5f7553" stroke-width="1.2"/>
<text x="455.0" y="281.0" font-size="15" font-weight="700" fill="#2f3d27" text-anchor="middle" dominant-baseline="central">回來：短對話＋一份工作日誌</text>
<text x="30" y="324" font-size="13" font-weight="400" fill="#6a635a" text-anchor="start" dominant-baseline="central">寫＋壓＝先寫工作日誌和續接卡，再壓縮上下文（這時讀前面的對話還是快取價）</text>
</svg>
