<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC',sans-serif">
  <title>上一題提示列示意：輸入框上方一列顯示上一題、多久前問的、上下文已使用多少的彩色圓圈，以及四種顏色代表的用量</title>
  <rect width="1200" height="640" fill="#fefcf8"/>
  <text x="60" y="62" font-size="26" font-weight="700" fill="#1a1612">輸入框上方多了一列</text>
  <text x="60" y="96" font-size="19" fill="#6a635a">示意圖。上一題、多久前問的、上下文用了多少，抬頭就看得到</text>

  <!-- 對話框 -->
  <rect x="60" y="126" width="1080" height="210" rx="18" fill="#ffffff" stroke="#d8cdb8" stroke-width="2"/>
  <!-- 提示列 -->
  <rect x="84" y="148" width="1032" height="56" rx="10" fill="#faf5ec"/>
  <text x="108" y="184" font-size="22" fill="#8a8278">上一題（3 分鐘前・</text>
  <circle cx="318" cy="177" r="11" fill="#9CA3AF" fill-opacity="0.45"/>
  <path d="M318 177 L318 166 A11 11 0 0 1 328.91 178.38 Z" fill="#16A34A"/>
  <text x="334" y="184" font-size="22" fill="#8a8278">）：</text>
  <text x="372" y="184" font-size="22" fill="#1a1612">幫我把這份會議紀錄整理成三個重點</text>
  <rect x="1012" y="160" width="84" height="34" rx="8" fill="#ffffff" stroke="#d8cdb8"/>
  <text x="1054" y="183" font-size="18" fill="#3a342d" text-anchor="middle">收起</text>
  <!-- 輸入框 -->
  <rect x="84" y="220" width="1032" height="94" rx="12" fill="#ffffff" stroke="#e6dccb"/>
  <text x="700" y="262" font-size="21" fill="#b3aa9c">在這裡輸入下一個問題…</text>

  <!-- 標註 -->
  <g font-size="17" fill="#5689b8">
    <path d="M200 206 L200 372" stroke="#5689b8" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="134" y="396">多久前問的，每分鐘更新</text>
    <path d="M318 192 L318 372" stroke="#5689b8" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="352" y="396">上下文用了多少，滑鼠移上去看 %</text>
    <path d="M620 206 L620 372" stroke="#5689b8" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="640" y="396">你上一個送出的問題</text>
    <path d="M1054 196 L1054 372" stroke="#5689b8" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="960" y="396">先藏起來</text>
  </g>

  <!-- 顏色分級 -->
  <text x="60" y="462" font-size="22" font-weight="700" fill="#1a1612">圓圈越滿、顏色越熱，上下文用得越多</text>
  <g font-size="20" fill="#3a342d">
    <g transform="translate(60,492)">
      <rect width="255" height="110" rx="14" fill="#ffffff" stroke="#d8cdb8"/>
      <circle cx="56" cy="55" r="26" fill="#9CA3AF" fill-opacity="0.45"/>
      <path d="M56 55 L56 29 A26 26 0 0 1 77.03 39.72 Z" fill="#86EFAC"/>
      <text x="100" y="48" font-weight="700">淺綠</text><text x="100" y="78" fill="#6a635a">20% 以內</text>
    </g>
    <g transform="translate(335,492)">
      <rect width="255" height="110" rx="14" fill="#ffffff" stroke="#d8cdb8"/>
      <circle cx="56" cy="55" r="26" fill="#9CA3AF" fill-opacity="0.45"/>
      <path d="M56 55 L56 29 A26 26 0 0 1 56 81 Z" fill="#16A34A"/>
      <text x="100" y="48" font-weight="700">深綠</text><text x="100" y="78" fill="#6a635a">21 到 50%</text>
    </g>
    <g transform="translate(610,492)">
      <rect width="255" height="110" rx="14" fill="#ffffff" stroke="#d8cdb8"/>
      <circle cx="56" cy="55" r="26" fill="#9CA3AF" fill-opacity="0.45"/>
      <path d="M56 55 L56 29 A26 26 0 1 1 40.72 76.03 Z" fill="#FACC15"/>
      <text x="100" y="48" font-weight="700">黃</text><text x="100" y="78" fill="#6a635a">51 到 69%</text>
    </g>
    <g transform="translate(885,492)">
      <rect width="255" height="110" rx="14" fill="#ffffff" stroke="#d8cdb8"/>
      <circle cx="56" cy="55" r="26" fill="#9CA3AF" fill-opacity="0.45"/>
      <path d="M56 55 L56 29 A26 26 0 1 1 31.27 46.97 Z" fill="#EF4444"/>
      <text x="100" y="48" font-weight="700">紅</text><text x="100" y="78" fill="#6a635a">70% 以上</text>
    </g>
  </g>
</svg>
