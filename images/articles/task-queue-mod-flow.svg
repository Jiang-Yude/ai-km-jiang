<text x="540" y="642" text-anchor="middle" font-size="44" font-weight="900" fill="#777">◌ 待檢查</text>
<text x="540" y="690" text-anchor="middle" font-size="26" fill="#888">灰色，等我驗</text>
<line x1="540" y1="720" x2="540" y2="950" stroke="#7a6a58" stroke-width="4" marker-end="url(#a)"/>
<text x="560" y="840" font-size="28" fill="#3a2a1c">我按「驗過了」</text>
<rect x="290" y="960" width="500" height="150" rx="26" fill="#e6f3e9" stroke="#3c8a4f" stroke-width="4"/>
