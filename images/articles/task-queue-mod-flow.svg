<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" font-family="'Noto Sans TC','PingFang TC',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a6a58"/></marker></defs>
<rect width="1080" height="1350" fill="#fbf6ee"/>
<text x="540" y="100" text-anchor="middle" font-size="46" font-weight="900" fill="#3a2a1c">一件任務走的三格</text>
<rect x="290" y="190" width="500" height="150" rx="26" fill="#fff" stroke="#b0743a" stroke-width="4"/>
<text x="540" y="262" text-anchor="middle" font-size="44" font-weight="900" fill="#3a2a1c">○ 未完成</text>
<text x="540" y="310" text-anchor="middle" font-size="26" fill="#7a6a58">AI 一次只做第 1 件</text>
