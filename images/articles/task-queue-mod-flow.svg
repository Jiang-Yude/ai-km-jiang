<text x="540" y="1080" text-anchor="middle" font-size="26" fill="#3c8a4f">綠色</text>
<path d="M290 645 C150 645 150 265 280 265" fill="none" stroke="#c0392b" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#a)"/>
<text x="60" y="440" font-size="28" fill="#c0392b">退回</text>
<text x="60" y="478" font-size="24" fill="#c0392b">附原因</text>
<path d="M790 265 C960 265 960 1035 800 1035" fill="none" stroke="#3c8a4f" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#a)"/>
<text x="885" y="620" font-size="26" fill="#3c8a4f">我自己</text>
<text x="885" y="656" font-size="26" fill="#3c8a4f">按完成</text>
<text x="885" y="692" font-size="26" fill="#3c8a4f">直接完成</text>
<text x="540" y="1220" text-anchor="middle" font-size="28" fill="#7a6a58">待檢查只管 AI 說做完的那些</text>
