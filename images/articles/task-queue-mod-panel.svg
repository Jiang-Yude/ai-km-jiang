<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" font-family="'Noto Sans TC','PingFang TC',sans-serif">
<rect width="1080" height="1350" fill="#fbf6ee"/>
<text x="540" y="96" text-anchor="middle" font-size="46" font-weight="900" fill="#3a2a1c">對話旁的任務佇列面板</text>
<text x="540" y="150" text-anchor="middle" font-size="28" fill="#7a6a58">一件事從上往下走</text>
<rect x="150" y="200" width="780" height="1080" rx="28" fill="#fff" stroke="#e2d4c0" stroke-width="3"/>
<text x="200" y="270" font-size="38" font-weight="900" fill="#3a2a1c">任務佇列（2）</text>
<rect x="200" y="300" width="680" height="64" rx="14" fill="#f5efe6" stroke="#e2d4c0"/>
<text x="226" y="343" font-size="26" fill="#9a8a78">加一件事，Enter 排到最後</text>
<text x="200" y="430" font-size="26" font-weight="700" fill="#b0743a">未完成</text>
<text x="200" y="485" font-size="32" font-weight="900" fill="#3a2a1c">○ 第 1 件（AI 現在做這件）</text>
<text x="200" y="540" font-size="32" fill="#3a2a1c">○ 第 2 件</text>
<text x="230" y="585" font-size="24" fill="#c0392b">被退回：附上退回原因</text>
<line x1="200" y1="625" x2="880" y2="625" stroke="#eee3d3" stroke-width="2"/>
<text x="200" y="685" font-size="26" font-weight="700" fill="#5689b8">已另開到別的對話</text>
<text x="200" y="740" font-size="32" fill="#3a2a1c">↗ 太大的那件</text>
<line x1="200" y1="785" x2="880" y2="785" stroke="#eee3d3" stroke-width="2"/>
<text x="200" y="845" font-size="26" font-weight="700" fill="#8a8a8a">待檢查（AI 說做完了，等你驗）</text>
<text x="200" y="900" font-size="32" fill="#9a9a9a">◌ AI 做完的那件</text>
<g font-size="24"><rect x="200" y="925" width="150" height="50" rx="10" fill="#f0f0f0"/><text x="275" y="958" text-anchor="middle" fill="#555">打開成果</text>
<rect x="365" y="925" width="130" height="50" rx="10" fill="#f0f0f0"/><text x="430" y="958" text-anchor="middle" fill="#555">驗過了</text>
<rect x="510" y="925" width="100" height="50" rx="10" fill="#f0f0f0"/><text x="560" y="958" text-anchor="middle" fill="#555">退回</text></g>
<line x1="200" y1="1015" x2="880" y2="1015" stroke="#eee3d3" stroke-width="2"/>
<text x="200" y="1075" font-size="26" font-weight="700" fill="#3c8a4f">已完成</text>
<text x="200" y="1130" font-size="32" fill="#3c8a4f">✓ 我驗過的那件</text>
<text x="200" y="1185" font-size="32" fill="#3c8a4f">✓ 我自己按完成的那件</text>
</svg>
