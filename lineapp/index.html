<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>江江 Line App</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Line App"><meta name="theme-color" content="#fffcf6">
<link rel="apple-touch-icon" href="/card/portrait-round.png">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#f5f0e7;color:#382f26;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.4;display:flex;flex-direction:column;overflow:hidden}
.rail{flex:1;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px;align-items:center;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.slide,.bubble{flex:0 0 min(86vw,386px);scroll-snap-align:center}
.slide{background:#fffcf6;border-radius:18px;padding:24px 18px;text-align:center;box-shadow:0 8px 24px #7b61341a}
.slide h1{font-size:24px;margin:0 0 4px}.slide p{font-size:18px;color:#817466;margin:0 0 16px}
.qr{width:100%;aspect-ratio:1;background:#fff;border-radius:16px;padding:12px}
.swipe{font-size:16px;color:#a27c45;margin:14px 0 0}
.bubble{display:flex;flex-direction:column;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px #7b61341a;align-self:stretch;max-height:100%;overflow-y:auto}
.bubble>.body{flex:1}
.fx-link{display:block;text-align:center;color:#42659a;font-size:16px;padding:10px 0;text-decoration:none}
.dots{display:flex;justify-content:center;gap:8px;padding:2px 0 10px}
.dots i{width:8px;height:8px;border-radius:50%;background:#d8ccb8}.dots i.on{background:#a27c45}
.bar{padding:0 16px calc(16px + env(safe-area-inset-bottom))}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:420px;margin:0 auto;padding:17px 12px;border-radius:14px;font-size:21px;font-weight:700;text-decoration:none;background:#06c755;color:#fff}
</style></head><body>
