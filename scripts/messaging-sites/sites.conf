# 對外講法漂移健檢：站台清單
# 一行一站，加站只要加一行，不用改程式。
# 格式：<站台代號>|<站台根目錄>|<上游 repo（owner/name，沒有填 -）>|<必要性>|<說明>
#
# 站台根目錄：
#   .            = 本 repo 根目錄（messaging-check.py 的上一層）
#   $HOME/...    = 展開成當前使用者家目錄（跨機器安全，不准寫死 /Users/<帳號名>/）
#   /abs/path    = 絕對路徑
# 必要性（2026-08-26 依 Codex 跨家審意見加，原本一律 SKIP 會「假全綠」）：
#   required = 這台機器一定要有這個站，找不到就 FAIL（根目錄打錯會被抓出來）
#   optional = 找不到就 SKIP 不算失敗（排程機器不一定有每個客戶站的 clone）
# 代號只能用英數與 . _ -；根目錄不准寫死 /Users/<帳號名>/ 或 /home/<帳號名>/。
#
# 每站的三份設定檔放 scripts/messaging-sites/<站台代號>/：
#   blocklist.txt  禁用詞（漂移講法）
#   scope.txt      掃描範圍（限縮範圍才不會誤報）
#   versioned.txt  必須帶上游版本標記的檔案

jiangyude|.|Jiang-Yude/mika|required|江江教練知識官網（本 repo）
yongli-canvas|$HOME/Developer/yongli-canvas|-|optional|永力智庫團隊檢索站（半私密）
