<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>網站流量統計｜江江教練 · AI 知識管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--ink:#1a1612;--paper:#fefcf8;--muted:#6a635a;--line:#d8cdb8;--green:#5f7553;--blue:#5689b8;--orange:#e85a4f;--soft:#faf5ec;--sand:#a08144}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",sans-serif}
a{color:inherit}
nav.top{position:sticky;top:0;background:rgba(254,252,248,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:100}
nav.top .container{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:14px 32px}
nav.top a.brand{display:flex;align-items:center;text-decoration:none}
nav.top a.brand img{height:36px}
nav.top .links{display:flex;gap:20px;font-size:.95rem}
nav.top .links a{color:#3a342d;text-decoration:none;font-weight:500}
.hero{padding:64px clamp(20px,6vw,88px) 36px;background:linear-gradient(180deg,#fffcf0 0%,#f9e9d2 100%);border-bottom:1px solid var(--line)}
.hero .kicker{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.4rem;color:#7a5c3a}
.hero h1{margin:8px 0 6px;font-size:clamp(30px,5vw,52px)}
.hero p{margin:0;color:#3a342d;font-size:18px}
.wrap{max-width:1000px;margin:0 auto;padding:40px clamp(20px,6vw,60px) 80px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:44px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 8px 22px rgba(107,74,42,.08);text-align:center}
.card .n{font:700 40px/1 "JetBrains Mono",monospace;color:var(--ink)}
.card .l{margin-top:8px;font-size:15px;color:var(--muted)}
h2{font-size:clamp(22px,3.2vw,30px);margin:36px 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.chart{display:flex;align-items:flex-end;gap:6px;height:220px;padding:14px 4px 0;border-bottom:2px solid var(--line);overflow-x:auto}
.bar{flex:1 0 18px;min-width:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar .fill{width:70%;min-height:2px;background:linear-gradient(180deg,#e8884b,#a08144);border-radius:4px 4px 0 0;transition:height .3s}
.bar .v{font:600 11px/1 "JetBrains Mono",monospace;color:var(--muted);margin-bottom:4px}
.bar .d{font-size:10px;color:var(--muted);margin-top:6px;writing-mode:vertical-rl;height:34px}
.months{list-style:none;padding:0;margin:12px 0 0}
.months li{display:flex;justify-content:space-between;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;font-size:16px}
.months li b{font:700 16px/1 "JetBrains Mono",monospace}
.foot{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.7}
.loading{color:var(--muted);padding:30px 0}
@media(max-width:640px){.cards{grid-template-columns:1fr}nav.top .links{display:none}}
</style>
<!-- tracking:vercel-analytics -->
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
<nav class="top"><div class="container">
  <a class="brand" href="index.html"><img src="images/footer-signature.png" alt="江江教練"></a>
  <div class="links"><a href="index.html">首頁</a><a href="articles.html">深度文章</a><a href="offers.html">服務方案</a></div>
</div></nav>

<section class="hero">
  <div class="kicker">Site Traffic</div>
  <h1>網站流量統計</h1>
  <p>這個網站累計被看了 <b data-views="global">…</b> 次。資料自動累計，不經過 Google。</p>
</section>

<div class="wrap">
  <div class="cards">
    <div class="card"><div class="n" id="c-total">…</div><div class="l">全站累計瀏覽</div></div>
    <div class="card"><div class="n" id="c-month">…</div><div class="l">本月累計</div></div>
    <div class="card"><div class="n" id="c-today">…</div><div class="l">今日</div></div>
  </div>

  <h2>本月每日流量</h2>
  <p class="sub" id="month-label">載入中…</p>
  <div class="chart" id="daily"><div class="loading">載入中…</div></div>

  <h2>歷月流量</h2>
  <ul class="months" id="monthly"><li class="loading">載入中…</li></ul>

  <div class="foot">
    數字為自動累計，同一瀏覽器同一頁一小時只計一次。統計方式：自建 Vercel Function + Upstash Redis，不使用 Google Analytics。
  </div>
</div>

<script>
(function(){
  fetch('/api/stats').then(function(r){return r.json();}).then(function(d){
    var total=d.total||0;
    document.getElementById('c-total').textContent=total.toLocaleString();
    var days=d.days||[], months=d.months||[];
    // 本月累計＋今日
    var monthSum=days.reduce(function(a,x){return a+(x.count||0);},0);
    var todayCount=days.length?days[days.length-1].count:0;
    document.getElementById('c-month').textContent=monthSum.toLocaleString();
    document.getElementById('c-today').textContent=(todayCount||0).toLocaleString();
    document.getElementById('month-label').textContent=(d.today?d.today.slice(0,7):'')+'　共 '+days.length+' 天';
    // 每日長條
    var chart=document.getElementById('daily'); chart.innerHTML='';
    var max=Math.max.apply(null,days.map(function(x){return x.count||0;}).concat([1]));
    days.forEach(function(x){
      var bar=document.createElement('div');bar.className='bar';
      var pct=Math.round((x.count||0)/max*100);
      bar.innerHTML='<div class="v">'+(x.count||0)+'</div><div class="fill" style="height:'+pct+'%"></div><div class="d">'+x.date.slice(5)+'</div>';
      chart.appendChild(bar);
    });
    if(!days.length) chart.innerHTML='<div class="loading">尚無資料</div>';
    // 歷月（新到舊）
    var ul=document.getElementById('monthly'); ul.innerHTML='';
    months.slice().reverse().forEach(function(m){
      var li=document.createElement('li');
      li.innerHTML='<span>'+m.month+'</span><b>'+(m.count||0).toLocaleString()+'</b>';
      ul.appendChild(li);
    });
    if(!months.length) ul.innerHTML='<li class="loading">尚無資料</li>';
  }).catch(function(){
    document.getElementById('daily').innerHTML='<div class="loading">讀取失敗（可能還沒設定 Upstash 或還沒部署）</div>';
  });
})();
</script>
