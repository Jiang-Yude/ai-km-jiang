name = "ai-km-jiang-cf-20261004"
compatibility_date = "2026-09-04"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./.cloudflare-output"
# 智慧放置：台灣請求常落在香港機房，Claude API 不服務香港；讓 Functions 移到靠近後端的機房執行
[placement]
mode = "smart"

[vars]
CF_SITE_MODE = "preview"

[env.preview.vars]
# 線上擼貓（2026-11-26 江江：「自動都包我做好 更新官網網站」）：PETCAT_OPENAI_API_KEY 用 secret-paste 放進機密；改 "0" 再發布即關閉生成
PETCAT_ENABLED = "1"
CF_SITE_MODE = "preview"
# 2026-11-19 預覽站先開會員（正式站仍關）：還要 GOOGLE_CLIENT_ID 填這裡、GOOGLE_CLIENT_SECRET 用 wrangler pages secret put --env preview 設定，缺一個就維持關閉
MEMBER_ENABLED = "1"
GOOGLE_CLIENT_ID = "224464919360-b3ks6fq2bq9l0lp99qdpo0844g50b5k5.apps.googleusercontent.com"
LLM_PRIMARY = "claude"
CLAUDE_MODEL = "claude-haiku-5-5"
CLAUDE_EFFORT = "medium"

[env.production.vars]
# 線上擼貓（2026-11-26 江江：「自動都包我做好 更新官網網站」）：PETCAT_OPENAI_API_KEY 用 secret-paste 放進機密；改 "0" 再發布即關閉生成
PETCAT_ENABLED = "1"
CF_SITE_MODE = "production"
# 會員登入與留言板（2026-11-04）：拿到 Google OAuth 用戶端 ID 後填 GOOGLE_CLIENT_ID、MEMBER_ENABLED 改 "1" 再發布。
# GOOGLE_CLIENT_SECRET 與 MEMBER_ADMIN_EMAILS 是機密，不寫在這裡，用 wrangler pages secret put 設定（見 docs/member-setup.md）。
# 2026-11-19 13:21 江江：「可以，全部打開」→ 正式站開會員
MEMBER_ENABLED = "1"
GOOGLE_CLIENT_ID = "224464919360-b3ks6fq2bq9l0lp99qdpo0844g50b5k5.apps.googleusercontent.com"
CF_PROD_KEYS = "original"
# 咪卡客服模型切換點：claude＝先 Claude 失敗換 OpenAI；改 openai 再發布即退回
LLM_PRIMARY = "claude"
CLAUDE_MODEL = "claude-haiku-5-5"
CLAUDE_EFFORT = "medium"
